[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "powerbi-measure-tool"
version = "0.1.4"
description = "Find, remove, and copy measures in Power BI PBIP/TMDL projects"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
authors = [
  { name = "Mithun K", email = "mithunkarthick7@hotmail.com" }
]
keywords = ["powerbi", "pbip", "tmdl", "dax", "measures", "power-bi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]

[project.scripts]
pbi-measure = "powerbi_measure_tool.measure_tool:main"

[project.urls]
Homepage    = "https://github.com/Mitz619/powerbi-measure-tool"
Repository  = "https://github.com/Mitz619/powerbi-measure-tool"
Issues      = "https://github.com/Mitz619/powerbi-measure-tool/issues"
Changelog   = "https://github.com/Mitz619/powerbi-measure-tool/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/powerbi_measure_tool"]
